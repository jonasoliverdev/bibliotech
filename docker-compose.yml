services:
  mysql:
    image: mysql:8.4
    container_name: bibliotech-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bibliotech
      MYSQL_USER: bibliotech
      MYSQL_PASSWORD: bibliotech_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - bibliotech_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bibliotech_mysql_data: